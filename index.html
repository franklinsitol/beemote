<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceAI P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #000; --card: #1c1c1e; --green: #30d158; --red: #ff453a; --blue: #0a84ff; --text: #fff; --btn-r: 16px; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .phone { width: 100%; max-width: 420px; height: 100%; background: #111; position: relative; display: flex; flex-direction: column; border-radius: 0; }
        
        /* VIEWS */
        .screen { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .screen.active { display: flex; }

        h2 { margin-bottom: 10px; font-weight: 500; }
        .hint { color: #666; font-size: 14px; margin-bottom: 30px; }

        /* INPUTS & BUTTONS */
        .big-input { background: #222; border: 1px solid #333; color: white; font-size: 24px; text-align: center; width: 100%; padding: 15px; border-radius: var(--btn-r); margin-bottom: 20px; outline: none; }
        .btn { width: 100%; padding: 18px; border-radius: var(--btn-r); border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-green { background: var(--green); color: white; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-outline { background: transparent; border: 1px solid #444; color: #aaa; }

        /* ANIMATIONS */
        .pulse-ring { width: 120px; height: 120px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; margin-bottom: 30px; color: var(--blue); position: relative; }
        .waiting .pulse-ring { animation: pulse 2s infinite; color: var(--green); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(48, 209, 88, 0); } 100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); } }

        /* CALL UI */
        .captions { height: 80px; width: 100%; background: #222; border-radius: 15px; padding: 15px; display: flex; align-items: center; justify-content: center; font-style: italic; color: #ddd; margin-bottom: 20px; border: 1px solid #333; font-size: 14px; }
        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .ctrl-btn { background: #2c2c2e; color: white; border: none; padding: 15px; border-radius: 15px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .ctrl-btn.active { background: white; color: black; }
        .ctrl-btn i { font-size: 20px; }
        .hangup { grid-column: span 2; background: var(--red); color: white; }
    </style>
</head>
<body>

<div class="phone">

    <!-- TELA 1: LOGIN (Criar sua ID) -->
    <div id="screen-login" class="screen active">
        <div class="pulse-ring"><i class="fas fa-fingerprint"></i></div>
        <h2>VoiceAI P2P</h2>
        <p class="hint">Crie um ID para receber chamadas</p>
        
        <input type="text" id="my-id" class="big-input" placeholder="Seu Nome/ID">
        
        <button class="btn btn-blue" onclick="register()">
            <i class="fas fa-power-off"></i> Ficar Online
        </button>
    </div>

    <!-- TELA 2: AGUARDANDO (Compartilhar Link) -->
    <div id="screen-waiting" class="screen">
        <div class="pulse-ring waiting"><i class="fas fa-wifi"></i></div>
        <h2 id="display-id">...</h2>
        <p class="hint">Você está online. Envie o link para alguém te ligar.</p>

        <button class="btn btn-green" onclick="shareWhatsapp()">
            <i class="fab fa-whatsapp"></i> Convidar Amigo
        </button>
        
        <div style="width:100%; border-top:1px solid #333; margin:20px 0;"></div>
        <p class="hint" style="margin-bottom:10px">Ou digite para ligar:</p>
        <input type="text" id="target-id" class="big-input" placeholder="ID do Amigo">
        <button class="btn btn-outline" onclick="manualCall()">Ligar Agora</button>
    </div>

    <!-- TELA 3: CHAMADA (Voz + IA) -->
    <div id="screen-call" class="screen">
        <div class="pulse-ring" style="color:white; width:80px; height:80px; font-size:30px;"><i class="fas fa-user"></i></div>
        <h3 id="call-status">Conectado</h3>
        <p class="hint" id="timer">00:00</p>

        <!-- Legendas -->
        <div class="captions" id="caption-box">"Aguardando fala..."</div>

        <div class="controls">
            <button class="ctrl-btn active" id="btn-mode" onclick="toggleAudioMode()">
                <i class="fas fa-ear-listen"></i> <span id="mode-text">Natural</span>
            </button>
            <button class="ctrl-btn" id="btn-lang" onclick="cycleLang()">
                <i class="fas fa-language"></i> <span id="lang-text">Traduzir: OFF</span>
            </button>
            <button class="ctrl-btn" id="btn-mic" onclick="toggleMic()">
                <i class="fas fa-microphone"></i> <span>Mic ON</span>
            </button>
            <button class="ctrl-btn" onclick="toggleMuteOutput()">
                <i class="fas fa-volume-high"></i> <span id="spk-text">Som ON</span>
            </button>
            <button class="btn hangup" onclick="endCall()">
                <i class="fas fa-phone-slash"></i> Encerrar
            </button>
        </div>

        <audio id="remote-audio" autoplay></audio>
    </div>

</div>

<script>
    // --- ESTADOS ---
    let peer, conn, mediaCall, localStream;
    let myPeerId = "";
    let listenMode = "natural"; // 'natural' | 'ai'
    let targetLang = "pt";
    let isTranslating = false;
    let callInterval, seconds = 0;

    // --- AUTO-BOOTSTRAP (Verifica se veio pelo link) ---
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const target = params.get('ligar_para');
        
        // Se abriu pelo link do WhatsApp
        if (target) {
            // Gera um ID aleatório para o convidado
            const guestId = "Visitante_" + Math.floor(Math.random() * 9999);
            document.getElementById('my-id').value = guestId;
            
            // Registra e já liga
            register(target); 
        }
    };

    // --- 1. REGISTRO P2P ---
    function register(autoCallTarget = null) {
        let id = document.getElementById('my-id').value.trim();
        if (!id) return alert("Digite um ID");
        // Limpa caracteres especiais do ID para evitar erros na URL
        id = id.replace(/[^a-zA-Z0-9_-]/g, '');

        myPeerId = id;

        peer = new Peer(myPeerId, { debug: 1 });

        peer.on('open', (id) => {
            console.log("Online como: " + id);
            
            // Pega microfone
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                localStream = stream;
                initRecognition();
                
                if (autoCallTarget) {
                    // Se veio do link, liga direto
                    switchScreen('call');
                    document.getElementById('call-status').innerText = "Ligando para " + autoCallTarget + "...";
                    connectToPeer(autoCallTarget);
                } else {
                    // Se é o anfitrião, vai para sala de espera
                    document.getElementById('display-id').innerText = id;
                    switchScreen('waiting');
                }
            }).catch(e => alert("Erro Mic: " + e));
        });

        // Receber Chamada
        peer.on('call', (call) => {
            if(confirm("Recebendo chamada! Atender?")) {
                call.answer(localStream);
                setupMediaCall(call);
                switchScreen('call');
            }
        });

        peer.on('connection', (c) => {
            conn = c;
            setupDataConnection();
        });

        peer.on('error', (err) => {
            if(err.type === 'unavailable-id') alert("ID em uso! Tente outro.");
            else alert("Erro: " + err.type);
        });
    }

    // --- 2. CONVITE WHATSAPP ---
    function shareWhatsapp() {
        const url = window.location.href.split('?')[0];
        const link = `${url}?ligar_para=${myPeerId}`;
        const msg = `📞 Estou online no VoiceAI.\nClique para falar comigo: ${link}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function manualCall() {
        const target = document.getElementById('target-id').value;
        if(target) connectToPeer(target);
    }

    // --- 3. CONEXÃO ---
    function connectToPeer(targetId) {
        // Conecta Dados (Texto)
        conn = peer.connect(targetId);
        conn.on('open', setupDataConnection);
        
        // Conecta Voz (Áudio)
        const call = peer.call(targetId, localStream);
        setupMediaCall(call);
    }

    function setupMediaCall(call) {
        mediaCall = call;
        call.on('stream', (remoteStream) => {
            document.getElementById('remote-audio').srcObject = remoteStream;
            document.getElementById('call-status').innerText = "Conectado";
            startTimer();
        });
        call.on('close', endCall);
    }

    function setupDataConnection() {
        conn.on('data', (data) => {
            // Chegou texto
            document.getElementById('caption-box').innerText = data.text;
            if (listenMode === 'ai') speak(data.text);
        });
    }

    // --- 4. STT (Reconhecimento) ---
    function initRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SpeechRecognition) return;
        
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.lang = 'pt-BR';
        recognition.interimResults = false;

        recognition.onresult = (e) => {
            const text = e.results[e.results.length - 1][0].transcript;
            if(conn && conn.open) conn.send({ text: text });
        };
        
        recognition.start();
        recognition.onend = () => { if(localStream) recognition.start(); };
    }

    // --- 5. TTS (Fala) ---
    function speak(text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = isTranslating ? (targetLang==='en'?'en-US':'es-ES') : 'pt-BR';
        window.speechSynthesis.speak(utter);
    }

    // --- UI HELPER ---
    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-'+id).classList.add('active');
    }

    function startTimer() {
        if(callInterval) return;
        callInterval = setInterval(() => {
            seconds++;
            const m = Math.floor(seconds/60).toString().padStart(2,'0');
            const s = (seconds%60).toString().padStart(2,'0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }, 1000);
    }

    function endCall() {
        if(mediaCall) mediaCall.close();
        if(conn) conn.close();
        location.href = window.location.href.split('?')[0]; // Reset total
    }

    // --- CONTROLES ---
    function toggleAudioMode() {
        const el = document.getElementById('remote-audio');
        if(listenMode==='natural') {
            listenMode='ai'; el.muted=true;
            document.getElementById('btn-mode').classList.remove('active');
            document.getElementById('mode-text').innerText = 'IA (Robô)';
        } else {
            listenMode='natural'; el.muted=false;
            document.getElementById('btn-mode').classList.add('active');
            document.getElementById('mode-text').innerText = 'Natural';
        }
    }

    function cycleLang() {
        const t = document.getElementById('lang-text');
        const b = document.getElementById('btn-lang');
        if(!isTranslating) { isTranslating=true; targetLang='en'; t.innerText="Trad: EN"; b.classList.add('active'); if(listenMode==='natural') toggleAudioMode(); }
        else if(targetLang==='en') { targetLang='es'; t.innerText="Trad: ES"; }
        else { isTranslating=false; targetLang='pt'; t.innerText="Trad: OFF"; b.classList.remove('active'); }
    }

    function toggleMic() {
        const t = localStream.getAudioTracks()[0];
        t.enabled = !t.enabled;
        document.getElementById('btn-mic').style.opacity = t.enabled ? '1' : '0.5';
    }
    
    function toggleMuteOutput() {
        const el = document.getElementById('remote-audio');
        // Apenas para áudio natural, não TTS
        if(listenMode === 'natural') el.muted = !el.muted;
        document.getElementById('spk-text').innerText = el.muted ? "Som OFF" : "Som ON";
    }

</script>
</body>
</html>
