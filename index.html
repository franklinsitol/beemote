<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beemote - Rede Social P2P</title>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
    <style>
        /* RESET E VARIÁVEIS - TEMA BRANCO/PRETO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --text-primary: #000000;
            --text-secondary: #555555;
            --accent: #000000;
            --accent-hover: #333333;
            --danger: #dc3545;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-hover: 0 4px 12px rgba(0,0,0,0.12);
            --radius: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --accent: #ffffff;
            --border: #333333;
            --shadow: 0 2px 8px rgba(255,255,255,0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: var(--transition);
        }

        /* SISTEMA DE DISPLAY - CRÍTICO */
        .hidden {
            display: none !important;
        }

        .app-screen, .auth-screen {
            display: none;
        }

        .app-screen.active, .auth-screen.active {
            display: block;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo::before {
            content: "🦛";
            font-size: 36px;
        }

        /* AUTH SCREEN */
        .auth-screen.active {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-box {
            background: var(--bg-primary);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-hover);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: var(--transition);
            min-height: 44px;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        button.secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        button.danger {
            background: var(--danger);
            color: white;
        }

        .error {
            color: var(--danger);
            font-size: 14px;
            margin-top: 8px;
        }

        .success {
            color: var(--success);
            font-size: 14px;
            margin-top: 8px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            font-weight: 600;
            transition: var(--transition);
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .tab:hover {
            color: var(--accent);
        }

        .tab.active {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        /* CONTEÚDO DAS ABAS */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* BOTÃO FLUTUANTE */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            transition: var(--transition);
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-primary);
            padding: 32px;
            border-radius: var(--radius);
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
        }

        /* POSTS */
        .post {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .post:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .post-content {
            margin: 16px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .post-media {
            margin: 16px 0;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .post-media img {
            max-width: 100%;
            display: block;
        }

        .post-media audio {
            width: 100%;
        }

        /* BOTÕES À DIREITA */
        .reactions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .reaction-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            cursor: pointer;
            font-size: 20px;
            padding: 8px 16px;
            border-radius: var(--radius);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            min-height: 44px;
        }

        .reaction-btn:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.1);
            border-color: var(--accent);
        }

        .reaction-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .comment-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        /* INPUT DE COMENTÁRIO COM BOTÃO À DIREITA */
        .comment-input {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            flex-direction: row-reverse;
        }

        .comment-input input {
            flex: 1;
        }

        .comment-input button {
            padding: 8px 16px;
        }

        .comment {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            font-size: 14px;
            border-left: 3px solid var(--accent);
        }

        /* PERFIL */
        .profile-header {
            background: var(--bg-primary);
            padding: 32px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .stat-card {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .stat-card h3 {
            font-size: 32px;
            margin-bottom: 4px;
            color: var(--accent);
        }

        .stat-card p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .export-import {
            display: flex;
            gap: 12px;
            margin: 24px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        #themeToggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 12px;
            transition: var(--transition);
            font-size: 18px;
            color: var(--text-primary);
        }

        #themeToggle:hover {
            transform: rotate(180deg);
            background: var(--accent);
            color: white;
        }

        /* BOTÕES À DIREITA NOS MODAIS */
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        /* STATUS DA CONEXÃO */
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 3000;
            transition: var(--transition);
        }

        .connection-status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .connection-status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .connection-status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
    </style>
</head>
<body>
    <!-- INDICADOR DE CONEXÃO P2P -->
    <div id="connectionStatus" class="connection-status connecting">
        Conectando à rede P2P...
    </div>

    <header>
        <div class="header-content">
            <div class="logo">Beemote</div>
            <div id="userInfo" class="hidden">
                <span id="username"></span>
                <button id="themeToggle" onclick="toggleTheme()">🌙</button>
                <button onclick="logout()" class="danger">Sair</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Tela de Login/Cadastro -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <div id="loginForm">
                    <h2>Entrar no Beemote</h2>
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="loginUsername" placeholder="seu_usuario">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                    <button onclick="login()">Entrar</button>
                    <button class="secondary" onclick="showRegister()" style="width: 100%; margin-top: 10px;">Criar Conta</button>
                    <div id="loginError" class="error"></div>
                </div>
                
                <div id="registerForm" class="hidden">
                    <h2>Criar Conta</h2>
                    <div class="form-group">
                        <label>Usuário (único)</label>
                        <input type="text" id="regUsername" placeholder="seu_usuario_unico">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="regPassword" placeholder="mínimo 8 caracteres">
                    </div>
                    <button onclick="register()">Criar</button>
                    <button class="secondary" onclick="showLogin()" style="width: 100%; margin-top: 10px;">Voltar</button>
                    <div id="regError" class="error"></div>
                    <div id="regSuccess" class="success"></div>
                </div>
            </div>
        </div>

        <!-- App Principal -->
        <div id="appScreen" class="app-screen hidden">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(event, 'feed')">Feed</div>
                <div class="tab" onclick="switchTab(event, 'profile')">Perfil</div>
                <div class="tab" onclick="switchTab(event, 'contacts')">Contatos</div>
                <div class="tab" onclick="switchTab(event, 'communities')">Comunidades</div>
            </div>

            <div id="feedTab" class="tab-content active">
                <div id="posts"></div>
            </div>

            <div id="profileTab" class="tab-content">
                <div class="profile-header">
                    <h2 id="profileName"></h2>
                    <p id="bioText" onclick="editBio()">Sem bio (clique para editar)</p>
                    <small id="profileJoined"></small>
                </div>
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="statPosts">0</h3>
                        <p>Posts</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statLikes">0</h3>
                        <p>Curtidas Recebidas</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statComments">0</h3>
                        <p>Comentários Recebidos</p>
                    </div>
                </div>
                <div class="export-import">
                    <button onclick="exportData()">📥 Exportar Dados</button>
                    <button onclick="document.getElementById('importFile').click()">📤 Importar Dados</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                </div>
                <h3 style="margin-top: 30px;">Mural de Depoimentos</h3>
                <div id="testimonialWall"></div>
            </div>

            <div id="contactsTab" class="tab-content">
                <div class="form-group">
                    <label>Adicionar Contato</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="contactUsername" placeholder="usuário">
                        <button onclick="requestContact()">Solicitar</button>
                    </div>
                </div>
                <div id="contactsList"></div>
            </div>

            <div id="communitiesTab" class="tab-content">
                <button onclick="showCreateCommunity()" class="secondary">Criar Comunidade</button>
                <div id="communitiesList" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante -->
    <button id="fab" class="fab hidden" onclick="showCreatePost()">✨</button>

    <!-- Modal de Criar Post -->
    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <h2>Criar Post</h2>
            <div class="form-group">
                <label>Tipo de Conteúdo</label>
                <select id="postType" onchange="changePostType()">
                    <option value="text">Texto</option>
                    <option value="audio">Áudio</option>
                    <option value="drawing">Desenho</option>
                </select>
            </div>
            <div id="textPost" class="form-group">
                <label>Texto</label>
                <textarea id="postText" rows="4" placeholder="O que está pensando?"></textarea>
            </div>
            <div id="audioPost" class="form-group hidden">
                <label>Gravar Áudio</label>
                <div class="audio-controls">
                    <button id="recordBtn" onclick="toggleRecording()">🎤 Gravar</button>
                    <button id="stopBtn" class="danger hidden" onclick="stopRecording()">⏹ Parar</button>
                    <span id="audioStatus">Pronto para gravar</span>
                </div>
                <audio id="audioPlayback" controls class="hidden"></audio>
            </div>
            <div id="drawingPost" class="form-group hidden">
                <label>Desenhar</label>
                <canvas id="drawingCanvas" width="800" height="600" style="border:1px solid var(--border); width:100%; max-width:100%; background:white;"></canvas>
                <button onclick="clearCanvas()" class="danger" style="margin-top:10px;">🗑️ Limpar</button>
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeModal()">Cancelar</button>
                <button onclick="createPost()">✨ Publicar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Comunidade -->
    <div id="communityModal" class="modal">
        <div class="modal-content">
            <h2>Criar Comunidade</h2>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="communityName" placeholder="Nome da comunidade">
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="communityDesc" rows="3"></textarea>
            </div>
            <div class="modal-actions">
                <button class="secondary" onclick="closeCommunityModal()">Cancelar</button>
                <button onclick="createCommunity()">Criar</button>
            </div>
        </div>
    </div>

    <script>
        // 🔧 DEPURAÇÃO - LOGS VISÍVEIS
        const DEBUG = true;
        function log(...args) {
            if (DEBUG) {
                console.log('[BEEMOTE]', ...args);
                const status = document.getElementById('connectionStatus');
                if (status && args[0] === 'CONECTADO') {
                    status.textContent = '✓ Conectado à rede P2P';
                    status.className = 'connection-status connected';
                } else if (status && args[0] === 'ERRO') {
                    status.textContent = '✗ Erro de conexão';
                    status.className = 'connection-status disconnected';
                }
            }
        }

        // CORREÇÃO DEFINITIVA DAS URLs - SEM ESPAÇOS E COM HTTPS CONFIÁVEL
        const gun = Gun([
            'https://gun-manhattan.herokuapp.com/gun',
            'https://gun-eu.herokuapp.com/gun',
            'https://gun-us.herokuapp.com/gun',
            // Backup: usar peer local se os outros falharem
            'http://localhost:8765/gun'
        ]);

        const user = gun.user();
        let currentUser = null;
        let currentTab = 'feed';
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        let isDrawing = false;
        let canvas = null;
        let ctx = null;
        let currentColor = '#000000';
        let currentBrushSize = 3;

        const REACTION_EMOJIS = {
            like: '👍', love: '❤️', laugh: '😂', wow: '😲', sad: '😢', angry: '😠'
        };

        // INICIALIZAÇÃO ROBUSTA
        window.addEventListener('DOMContentLoaded', function() {
            log('Inicializando Beemote...');
            
            // Inicializa canvas
            canvas = document.getElementById('drawingCanvas');
            if (canvas) {
                ctx = canvas.getContext('2d');
                ctx.strokeStyle = currentColor;
                ctx.lineWidth = currentBrushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('touchstart', handleTouch, { passive: false });
                canvas.addEventListener('touchmove', handleTouch, { passive: false });
                canvas.addEventListener('touchend', stopDrawing, { passive: false });
            }

            // Verifica login automático
            const alias = localStorage.getItem('beemote_alias');
            log('Login automático:', alias ? alias : 'Não encontrado');
            
            if (alias) {
                // Tenta autenticar automaticamente quando Gun estiver pronto
                gun.on('auth', () => {
                    log('Auth event disparado');
                    currentUser = user.is;
                    if (currentUser) {
                        log('Usuário autenticado:', currentUser.alias);
                        showApp();
                    }
                });
                
                // Timeout de segurança
                setTimeout(() => {
                    if (!currentUser) {
                        log('Timeout - mostrando tela de login');
                        showAuth();
                    }
                }, 3000);
            } else {
                log('Mostrando tela de login');
                showAuth();
            }

            // Configura tema
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        });

        function showAuth() {
            document.getElementById('authScreen').classList.add('active');
            document.getElementById('appScreen').classList.remove('active');
            document.getElementById('fab').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
        }

        function showApp() {
            log('Mostrando app...');
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('appScreen').classList.add('active');
            document.getElementById('fab').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('username').textContent = currentUser.alias;
            
            // Garante que a aba feed seja a ativa inicial
            switchTab({ target: document.querySelector('.tab') }, 'feed');
            
            // Inicializa dados
            loadFeed();
            loadContacts();
            loadCommunities();
            loadProfile();
            
            log('CONECTADO');
        }

        // FUNÇÕES DE DESENHO
        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            
            if (e.type === 'touchstart') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (isDrawing) {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        // AUTENTICAÇÃO
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            clearMessages();
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            clearMessages();
        }

        function clearMessages() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('regError').textContent = '';
            document.getElementById('regSuccess').textContent = '';
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (!username || password.length < 8) {
                document.getElementById('regError').textContent = 'Usuário inválido ou senha curta';
                return;
            }
            
            try {
                log('Criando usuário:', username);
                await user.create(username, password);
                user.get('profile').put({
                    bio: 'Hello Beemote! 🦛',
                    joined: Date.now()
                });
                document.getElementById('regSuccess').textContent = 'Conta criada! Faça login.';
                setTimeout(showLogin, 2000);
            } catch (e) {
                log('ERRO ao criar usuário:', e);
                document.getElementById('regError').textContent = 'Usuário já existe';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            try {
                log('Fazendo login:', username);
                await user.auth(username, password);
                localStorage.setItem('beemote_alias', username);
                currentUser = user.is;
                log('Login bem-sucedido');
                showApp();
            } catch (e) {
                log('ERRO no login:', e);
                document.getElementById('loginError').textContent = 'Login falhou';
            }
        }

        function logout() {
            user.leave();
            localStorage.removeItem('beemote_alias');
            location.reload();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        // FEED E POSTS - COM VERIFICAÇÃO DE CONEXÃO
        function loadFeed() {
            if (!currentUser) return;
            
            log('Carregando feed...');
            const postsDiv = document.getElementById('posts');
            postsDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Carregando posts...</p>';
            
            const posts = [];
            
            // Remove listeners antigos para evitar duplicação
            gun.get('beemote').get('posts').map().off();
            
            // NOVO listener que realmente funciona
            gun.get('beemote').get('posts').map().once((data, id) => {
                if (!data || (data.ttl && data.ttl < Date.now())) {
                    gun.get('beemote').get('posts').get(id).put(null);
                    return;
                }
                
                log('Post recebido:', id, data.author);
                
                const index = posts.findIndex(p => p.id === id);
                if (index > -1) {
                    posts[index] = { id, ...data };
                } else {
                    posts.push({ id, ...data });
                }
                
                posts.sort((a, b) => (b.bumpedAt || b.timestamp) - (a.bumpedAt || a.timestamp));
                
                // Renderiza imediatamente
                postsDiv.innerHTML = '';
                posts.forEach(post => renderPost(post));
                
                if (posts.length === 0) {
                    postsDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Nenhum post ainda. Seja o primeiro!</p>';
                }
            });
        }

        async function renderPost(post) {
            const postsDiv = document.getElementById('posts');
            const author = await getUserAlias(post.author);
            const reactions = post.reactions || {};
            const comments = post.comments || {};

            const postEl = document.createElement('div');
            postEl.className = 'post';
            
            // Gera HTML do post
            const commentsHtml = Object.entries(comments).map(([cid, c]) => `
                <div class="comment">
                    <strong onclick="loadUserProfile('${c.author}')" style="cursor:pointer; color:var(--accent);">
                        ${c.authorAlias || await getUserAlias(c.author)}
                    </strong>: ${c.text}
                    <br><small>${formatTime(c.timestamp)}</small>
                </div>
            `).join('');
            
            postEl.innerHTML = `
                <div class="post-header">
                    <span onclick="loadUserProfile('${post.author}')" style="cursor:pointer; font-weight:600; color:var(--accent);">${author}</span>
                    <span>${formatTime(post.bumpedAt || post.timestamp)}</span>
                </div>
                <div class="post-content">${post.content || ''}</div>
                ${post.media ? `<div class="post-media">${renderMedia(post.media)}</div>` : ''}
                <div class="reactions">
                    ${Object.entries(REACTION_EMOJIS).map(([type, emoji]) => `
                        <button class="reaction-btn ${reactions[currentUser.pub] === type ? 'active' : ''}" 
                                onclick="react('${post.id}', '${type}')">
                            ${emoji} ${getReactionCount(reactions, type)}
                        </button>
                    `).join('')}
                </div>
                <div class="comment-section">
                    <div class="comment-input">
                        <button onclick="comment('${post.id}')">➤</button>
                        <input type="text" id="comment-${post.id}" placeholder="Adicionar comentário..." 
                               onkeypress="if(event.key==='Enter') comment('${post.id}')">
                    </div>
                    <div id="comments-${post.id}">${commentsHtml}</div>
                </div>
            `;
            
            postsDiv.appendChild(postEl);
        }

        function getReactionCount(reactions, type) {
            const count = Object.values(reactions).filter(r => r === type).length;
            return count > 0 ? count : '';
        }

        function renderMedia(media) {
            if (!media) return '';
            if (media.startsWith('data:image')) return `<img src="${media}" alt="Desenho">`;
            if (media.startsWith('data:audio')) return `<audio controls src="${media}"></audio>`;
            return '';
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function showCreatePost() {
            document.getElementById('createPostModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('createPostModal').classList.remove('show');
            document.getElementById('postText').value = '';
            document.getElementById('audioPlayback').classList.add('hidden');
            clearCanvas();
        }

        function changePostType() {
            const type = document.getElementById('postType').value;
            document.getElementById('textPost').classList.toggle('hidden', type !== 'text');
            document.getElementById('audioPost').classList.toggle('hidden', type !== 'audio');
            document.getElementById('drawingPost').classList.toggle('hidden', type !== 'drawing');
        }

        async function createPost() {
            const type = document.getElementById('postType').value;
            let content = '';
            let media = '';
            
            if (type === 'text') {
                content = document.getElementById('postText').value.trim();
                if (!content) return alert('Escreva algo!');
            } else if (type === 'audio' && audioBlob) {
                media = await blobToDataURL(audioBlob);
            } else if (type === 'drawing') {
                media = canvas.toDataURL();
            }

            const postId = Date.now().toString();
            const timestamp = Date.now();
            const postData = {
                author: currentUser.pub,
                authorAlias: currentUser.alias,
                content,
                media,
                timestamp,
                bumpedAt: timestamp,
                ttl: timestamp + (24 * 60 * 60 * 1000)
            };

            log('Criando post:', postId, postData);
            
            gun.get('beemote').get('posts').get(postId).put(postData, ack => {
                if (ack.err) {
                    log('ERRO ao criar post:', ack.err);
                    alert('Erro ao publicar: ' + ack.err);
                } else {
                    log('Post criado com sucesso!');
                    user.get('posts').get(postId).put(postData);
                    user.get('stats').get('posts').once(count => {
                        user.get('stats').get('posts').put((count || 0) + 1);
                    });
                    
                    closeModal();
                    setTimeout(() => loadFeed(), 300);
                }
            });
        }

        async function loadProfile() {
            const profile = await getUserProfile(currentUser.pub);
            document.getElementById('profileName').textContent = currentUser.alias;
            
            const bioEl = document.getElementById('bioText');
            bioEl.textContent = profile.bio || 'Sem bio (clique para editar)';
            
            const joinedDate = profile.joined ? new Date(profile.joined) : new Date();
            document.getElementById('profileJoined').textContent = `Membro desde: ${joinedDate.toLocaleDateString('pt-BR')}`;

            const stats = profile.stats || {};
            document.getElementById('statPosts').textContent = stats.posts || 0;
            document.getElementById('statLikes').textContent = stats.likesReceived || 0;
            document.getElementById('statComments').textContent = stats.commentsReceived || 0;

            loadTestimonials();
        }

        function getUserProfile(pub) {
            return new Promise(resolve => {
                const profile = { stats: {}, joined: Date.now(), bio: '' };
                gun.user(pub).get('profile').once(data => {
                    if (data) Object.assign(profile, data);
                    resolve(profile);
                });
            });
        }

        function editBio() {
            const bioEl = document.getElementById('bioText');
            const currentBio = bioEl.textContent.replace('Sem bio (clique para editar)', '');
            const newBio = prompt('Edite sua bio:', currentBio);
            if (newBio !== null) {
                user.get('profile').get('bio').put(newBio);
                bioEl.textContent = newBio || 'Sem bio (clique para editar)';
            }
        }

        async function loadTestimonials() {
            const wall = document.getElementById('testimonialWall');
            wall.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Carregando depoimentos...</p>';
            
            const testimonials = [];
            user.get('testimonials').map().once((data, id) => {
                if (data && !data.hidden) testimonials.push({ id, ...data });
            });

            setTimeout(async () => {
                if (testimonials.length === 0) {
                    wall.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Nenhum depoimento ainda.</p>';
                    return;
                }
                wall.innerHTML = '';
                for (const t of testimonials) {
                    const author = await getUserAlias(t.author);
                    const testimonialEl = document.createElement('div');
                    testimonialEl.className = 'testimonial';
                    testimonialEl.style.cssText = 'background: var(--bg-secondary); padding: 15px; border-radius: var(--radius); margin-bottom: 10px; position: relative;';
                    testimonialEl.innerHTML = `
                        <div style="position:absolute; top:10px; right:10px;">
                            <button onclick="hideTestimonial('${t.id}')" class="danger" style="padding:5px 10px; font-size:12px;">Ocultar</button>
                        </div>
                        <p>${t.text}</p>
                        <small style="color:var(--text-secondary);">${author} - ${formatTime(t.timestamp)}</small>
                    `;
                    wall.appendChild(testimonialEl);
                }
            }, 500);
        }

        function hideTestimonial(id) {
            user.get('testimonials').get(id).get('hidden').put(true);
            loadTestimonials();
        }

        async function loadUserProfile(pub) {
            const alias = await getUserAlias(pub);
            const text = prompt(`Escreva um depoimento para @${alias}:`);
            if (text && text.trim()) {
                const id = Date.now().toString();
                gun.user(pub).get('testimonials').get(id).put({
                    author: currentUser.pub,
                    text: text.trim(),
                    timestamp: Date.now(),
                    hidden: false
                });
            }
        }

        function loadContacts() {
            const contactsDiv = document.getElementById('contactsList');
            contactsDiv.innerHTML = '';
            
            user.get('contacts').map().on((data, id) => {
                if (!data || !data.pub) return;
                const contactEl = document.createElement('div');
                contactEl.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-secondary); border-radius: var(--radius); margin-bottom: 8px;';
                contactEl.innerHTML = `
                    <div>
                        <strong>${data.alias || id}</strong>
                        <small style="color:var(--text-secondary); display:block;">${data.status}</small>
                    </div>
                    ${data.status === 'pending' ? 
                        `<button onclick="acceptContact('${data.pub}')">Aceitar</button>` : 
                        `<button class="danger" onclick="removeContact('${data.pub}')">Remover</button>`
                    }
                `;
                contactsDiv.appendChild(contactEl);
            });
        }

        async function requestContact() {
            const username = document.getElementById('contactUsername').value.trim();
            if (!username) return;
            
            gun.get('~@' + username).once(data => {
                if (!data) return alert('Usuário não encontrado');
                
                const pub = data.pub;
                user.get('contacts').get(pub).once(contact => {
                    if (contact && contact.status === 'accepted') {
                        alert('Já é seu contato!');
                        return;
                    }
                    
                    user.get('contacts').get(pub).put({
                        pub,
                        alias: username,
                        status: 'pending',
                        timestamp: Date.now()
                    });
                    
                    gun.user(pub).get('contact_requests').get(currentUser.pub).put({
                        from: currentUser.pub,
                        alias: currentUser.alias,
                        timestamp: Date.now()
                    });
                    
                    document.getElementById('contactUsername').value = '';
                    loadContacts();
                });
            });
        }

        function acceptContact(pub) {
            user.get('contacts').get(pub).put({ status: 'accepted' });
            loadContacts();
        }

        function removeContact(pub) {
            user.get('contacts').get(pub).put(null);
            loadContacts();
        }

        function showCreateCommunity() {
            document.getElementById('communityModal').classList.add('show');
        }

        function closeCommunityModal() {
            document.getElementById('communityModal').classList.remove('show');
            document.getElementById('communityName').value = '';
            document.getElementById('communityDesc').value = '';
        }

        function createCommunity() {
            const name = document.getElementById('communityName').value.trim();
            const desc = document.getElementById('communityDesc').value.trim();
            
            if (!name) return;
            
            const communityId = Date.now().toString();
            gun.get('beemote').get('communities').get(communityId).put({
                id: communityId,
                name,
                desc,
                owner: currentUser.pub,
                members: { [currentUser.pub]: 'admin' },
                created: Date.now()
            });
            
            closeCommunityModal();
            setTimeout(() => loadCommunities(), 500);
        }

        function loadCommunities() {
            const communitiesDiv = document.getElementById('communitiesList');
            communitiesDiv.innerHTML = '';
            
            gun.get('beemote').get('communities').map().on((data, id) => {
                if (!data || !data.id) return;
                const isMember = data.members && data.members[currentUser.pub];
                const communityEl = document.createElement('div');
                communityEl.style.cssText = 'background: var(--bg-secondary); padding: 15px; border-radius: var(--radius); margin-bottom: 10px;';
                communityEl.innerHTML = `
                    <h3 style="margin-bottom:5px;">${data.name}</h3>
                    <p style="color:var(--text-secondary); margin-bottom:10px;">${data.desc || 'Sem descrição'}</p>
                    <div style="display:flex; gap:10px;">
                        ${!isMember ? 
                            `<button onclick="joinCommunity('${data.id}')">Participar</button>` :
                            `<button class="secondary" onclick="leaveCommunity('${data.id}')">Sair</button>`
                        }
                        ${data.owner === currentUser.pub ? 
                            `<button class="danger" onclick="deleteCommunity('${data.id}')">Excluir</button>` : ''
                        }
                    </div>
                `;
                communitiesDiv.appendChild(communityEl);
            });
        }

        function joinCommunity(id) {
            gun.get('beemote').get('communities').get(id).get('members').get(currentUser.pub).put('member');
            setTimeout(() => loadCommunities(), 500);
        }

        function leaveCommunity(id) {
            gun.get('beemote').get('communities').get(id).get('members').get(currentUser.pub).put(null);
            setTimeout(() => loadCommunities(), 500);
        }

        function deleteCommunity(id) {
            gun.get('beemote').get('communities').get(id).put(null);
            setTimeout(() => loadCommunities(), 500);
        }

        async function exportData() {
            const data = { profile: {}, posts: {}, contacts: {}, testimonials: {} };
            
            await user.get('profile').once(p => data.profile = p || {});
            await user.get('posts').map().once((p, id) => data.posts[id] = p);
            await user.get('contacts').map().once((c, id) => data.contacts[id] = c);
            await user.get('testimonials').map().once((t, id) => data.testimonials[id] = t);
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `beemote_backup_${currentUser.alias}_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.profile) user.get('profile').put(data.profile);
                    Object.entries(data.posts || {}).forEach(([id, post]) => user.get('posts').get(id).put(post));
                    Object.entries(data.contacts || {}).forEach(([id, contact]) => user.get('contacts').get(id).put(contact));
                    Object.entries(data.testimonials || {}).forEach(([id, testimonial]) => user.get('testimonials').get(id).put(testimonial));
                    
                    alert('Dados importados com sucesso!');
                    location.reload();
                } catch (err) {
                    alert('Erro ao importar dados: arquivo inválido');
                }
            };
            reader.readAsText(file);
        }

        function switchTab(event, tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            // Recarrega dados ao mudar de aba
            if (tab === 'feed') loadFeed();
            if (tab === 'profile') loadProfile();
            if (tab === 'contacts') loadContacts();
            if (tab === 'communities') loadCommunities();
        }

        async function getUserAlias(pub) {
            return new Promise(resolve => {
                if (!pub) return resolve('Anônimo');
                gun.user(pub).get('alias').once(alias => {
                    resolve(alias || pub.substring(0, 8) + '...');
                });
            });
        }

        function react(postId, type) {
            if (!currentUser) return;
            
            gun.get('beemote').get('posts').get(postId).get('reactions').get(currentUser.pub).put(type, ack => {
                if (ack.err) log('ERRO ao reagir:', ack.err);
                else setTimeout(() => loadFeed(), 200);
            });
        }

        function comment(postId) {
            const input = document.getElementById(`comment-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const commentId = Date.now().toString();
            gun.get('beemote').get('posts').get(postId).get('comments').get(commentId).put({
                author: currentUser.pub,
                authorAlias: currentUser.alias,
                text,
                timestamp: Date.now()
            }, ack => {
                if (ack.err) log('ERRO ao comentar:', ack.err);
                else {
                    input.value = '';
                    setTimeout(() => loadFeed(), 300);
                }
            });
        }

        // AUTO-REFRESH CONTROLADO
        setInterval(() => {
            if (currentTab === 'feed' && currentUser) {
                log('Auto-refresh do feed...');
                loadFeed();
            }
        }, 10000);

        log('Script carregado completamente');
    </script>
</body>
</html>
