<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beemote - Rede Social P2P Premium</title>
    <!-- CORREÇÃO 1: Removidos espaços nas URLs -->
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
    <style>
        /* ... (seu CSS permanece o mesmo) ... */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #212529;
            --accent: #4361ee;
            --danger: #ef476f;
            --border: #dee2e6;
        }
        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header {
            background: linear-gradient(135deg, var(--accent), #3a56d4);
            color: white;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo::before { content: "🦛"; font-size: 36px; }
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--accent), #4895ef);
        }
        .auth-box {
            background: var(--bg-primary);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
        }
        button {
            background: linear-gradient(135deg, var(--accent), #3a56d4);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); }
        button.secondary {
            background: linear-gradient(135deg, var(--bg-secondary), var(--border));
            color: var(--text-primary);
        }
        .hidden { display: none !important; }
        .error { color: var(--danger); font-size: 14px; margin-top: 5px; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 600;
        }
        .tab.active { border-bottom-color: var(--accent); color: var(--accent); }
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #3a56d4);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-primary);
            padding: 32px;
            border-radius: 16px;
            max-width: 560px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalAppear 0.3s;
        }
        @keyframes modalAppear {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .post {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .post:hover { transform: translateY(-2px); }
        .reaction-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            margin-right: 8px;
        }
        .reaction-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">Beemote</div>
            <div id="userInfo" class="hidden">
                <span id="username"></span>
                <button id="themeToggle" onclick="toggleTheme()">🌙</button>
                <button onclick="logout()" class="danger">Sair</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Tela de Login/Cadastro -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <div id="loginForm">
                    <h2>Entrar no Beemote</h2>
                    <div class="form-group">
                        <label>Usuário</label>
                        <input type="text" id="loginUsername" placeholder="seu_usuario">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                    <button onclick="login()">Entrar</button>
                    <button class="secondary" onclick="showRegister()" style="width: 100%; margin-top: 10px;">Criar Conta</button>
                    <div id="loginError" class="error"></div>
                </div>
                
                <div id="registerForm" class="hidden">
                    <h2>Criar Conta</h2>
                    <div class="form-group">
                        <label>Usuário (único)</label>
                        <input type="text" id="regUsername" placeholder="seu_usuario_unico">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="regPassword" placeholder="mínimo 8 caracteres">
                    </div>
                    <button onclick="register()">Criar</button>
                    <button class="secondary" onclick="showLogin()" style="width: 100%; margin-top: 10px;">Voltar</button>
                    <div id="regError" class="error"></div>
                    <div id="regSuccess" class="success"></div>
                </div>
            </div>
        </div>

        <!-- App Principal -->
        <div id="appScreen" class="hidden">
            <div class="tabs">
                <div class="tab active" onclick="switchTab(event, 'feed')">Feed</div>
                <div class="tab" onclick="switchTab(event, 'profile')">Perfil</div>
                <div class="tab" onclick="switchTab(event, 'contacts')">Contatos</div>
                <div class="tab" onclick="switchTab(event, 'communities')">Comunidades</div>
            </div>

            <div id="feedTab" class="tab-content">
                <div id="posts"></div>
            </div>

            <div id="profileTab" class="tab-content hidden">
                <div class="profile-header">
                    <h2 id="profileName"></h2>
                    <p id="bioText" onclick="editBio()">Sem bio (clique para editar)</p>
                    <small id="profileJoined"></small>
                </div>
                <div class="stats">
                    <div class="stat-card">
                        <h3 id="statPosts">0</h3>
                        <p>Posts</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statLikes">0</h3>
                        <p>Curtidas Recebidas</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="statComments">0</h3>
                        <p>Comentários Recebidos</p>
                    </div>
                </div>
                <div class="export-import">
                    <button onclick="exportData()">📥 Exportar Dados</button>
                    <button onclick="document.getElementById('importFile').click()">📤 Importar Dados</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                </div>
                <h3>Mural de Depoimentos</h3>
                <div id="testimonialWall"></div>
            </div>

            <div id="contactsTab" class="tab-content hidden">
                <div class="form-group">
                    <label>Adicionar Contato</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="contactUsername" placeholder="usuário">
                        <button onclick="requestContact()">Solicitar</button>
                    </div>
                </div>
                <div id="contactsList"></div>
            </div>

            <div id="communitiesTab" class="tab-content hidden">
                <button onclick="showCreateCommunity()" class="secondary">Criar Comunidade</button>
                <div id="communitiesList" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>

    <!-- Botão Flutuante -->
    <button id="fab" class="fab hidden" onclick="showCreatePost()">✨</button>

    <!-- Modal de Criar Post -->
    <div id="createPostModal" class="modal">
        <div class="modal-content">
            <h2>Criar Post</h2>
            <div class="form-group">
                <label>Tipo de Conteúdo</label>
                <select id="postType" onchange="changePostType()">
                    <option value="text">Texto</option>
                    <option value="audio">Áudio</option>
                    <option value="drawing">Desenho</option>
                </select>
            </div>
            <div id="textPost" class="form-group">
                <label>Texto</label>
                <textarea id="postText" rows="4" placeholder="O que está pensando?"></textarea>
            </div>
            <div id="audioPost" class="form-group hidden">
                <label>Gravar Áudio</label>
                <div class="audio-controls">
                    <button id="recordBtn" onclick="toggleRecording()">🎤 Gravar</button>
                    <button id="stopBtn" class="danger hidden" onclick="stopRecording()">⏹ Parar</button>
                    <span id="audioStatus">Pronto para gravar</span>
                </div>
                <audio id="audioPlayback" controls class="hidden"></audio>
            </div>
            <div id="drawingPost" class="form-group hidden">
                <label>Desenhar</label>
                <canvas id="drawingCanvas" width="800" height="600" style="border:1px solid var(--border); width:100%; max-width:100%;"></canvas>
                <button onclick="clearCanvas()" class="danger" style="margin-top:10px;">🗑️ Limpar</button>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="createPost()">✨ Publicar</button>
                <button class="secondary" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // CORREÇÃO 2: URLs dos superpeers sem espaços
        const gun = Gun([
            'https://gun-manhattan.herokuapp.com/gun',
            'https://gun-eu.herokuapp.com/gun',
            'https://gun-us.herokuapp.com/gun'
        ]);

        const user = gun.user();
        let currentUser = null;
        let currentTab = 'feed';
        let mediaRecorder = null;
        let audioChunks = [];
        let audioBlob = null;
        let isDrawing = false;
        let canvas = null;
        let ctx = null;
        let currentColor = '#000000';
        let currentBrushSize = 3;

        const REACTION_EMOJIS = {
            like: '👍', love: '❤️', laugh: '😂', wow: '😲', sad: '😢', angry: '😠'
        };

        // INICIALIZAÇÃO
        window.onload = function() {
            canvas = document.getElementById('drawingCanvas');
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentBrushSize;
            
            // Eventos de desenho
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('touchstart', handleTouch, { passive: false });
            canvas.addEventListener('touchmove', handleTouch, { passive: false });
            canvas.addEventListener('touchend', stopDrawing, { passive: false });

            // CORREÇÃO 3: Login automático corrigido
            const alias = localStorage.getItem('beemote_alias');
            if (alias) {
                // Tenta autenticar automaticamente
                gun.on('auth', () => {
                    currentUser = user.is;
                    if (currentUser) showApp();
                });
            }
            
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        };

        function startDrawing(e) {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const y = (touch.clientY - rect.top) * (canvas.height / rect.height);
            
            if (e.type === 'touchstart') {
                isDrawing = true;
                ctx.beginPath();
                ctx.moveTo(x, y);
            } else if (isDrawing) {
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // AUTENTICAÇÃO
        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            clearMessages();
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            clearMessages();
        }

        function clearMessages() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('regError').textContent = '';
            document.getElementById('regSuccess').textContent = '';
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (!username || password.length < 8) {
                document.getElementById('regError').textContent = 'Usuário inválido ou senha curta';
                return;
            }
            
            try {
                await user.create(username, password);
                user.get('profile').put({
                    bio: 'Hello Beemote! 🦛',
                    joined: Date.now()
                });
                document.getElementById('regSuccess').textContent = 'Conta criada! Faça login.';
                setTimeout(showLogin, 2000);
            } catch (e) {
                document.getElementById('regError').textContent = 'Usuário já existe';
            }
        }

        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            try {
                await user.auth(username, password);
                localStorage.setItem('beemote_alias', username);
                currentUser = user.is;
                showApp();
            } catch (e) {
                document.getElementById('loginError').textContent = 'Login falhou';
            }
        }

        function logout() {
            user.leave();
            localStorage.removeItem('beemote_alias');
            location.reload();
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
        }

        function showApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            document.getElementById('fab').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('username').textContent = currentUser.alias;
            
            loadFeed();
            loadContacts();
            loadCommunities();
            loadProfile();
        }

        // FEED E POSTS
        // CORREÇÃO 4: Carregamento do feed otimizado com callbacks do GunDB
        function loadFeed() {
            const postsDiv = document.getElementById('posts');
            postsDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Carregando posts...</p>';
            
            const posts = [];
            
            // Usa .on() para escutar atualizações em tempo real
            gun.get('beemote').get('posts').map().on((data, id) => {
                if (!data || (data.ttl && data.ttl < Date.now())) {
                    // Remove posts expirados
                    gun.get('beemote').get('posts').get(id).put(null);
                    return;
                }
                
                // Atualiza ou adiciona post
                const index = posts.findIndex(p => p.id === id);
                if (index > -1) {
                    posts[index] = { id, ...data };
                } else {
                    posts.push({ id, ...data });
                }
                
                // Ordena e renderiza
                posts.sort((a, b) => (b.bumpedAt || b.timestamp) - (a.bumpedAt || a.timestamp));
                
                // Limpa e renderiza todos os posts
                postsDiv.innerHTML = '';
                posts.forEach(post => renderPost(post));
                
                if (posts.length === 0) {
                    postsDiv.innerHTML = '<p style="text-align:center; color:var(--text-secondary);">Nenhum post ainda. Seja o primeiro!</p>';
                }
            });
        }

        async function renderPost(post) {
            const postsDiv = document.getElementById('posts');
            const author = await getUserAlias(post.author);
            const reactions = post.reactions || {};
            const comments = post.comments || {};

            const postEl = document.createElement('div');
            postEl.className = 'post';
            postEl.innerHTML = `
                <div class="post-header">
                    <span onclick="loadUserProfile('${post.author}')" style="cursor:pointer; font-weight:600; color:var(--accent);">${author}</span>
                    <span>${formatTime(post.bumpedAt || post.timestamp)}</span>
                </div>
                <div class="post-content">${post.content || ''}</div>
                ${post.media ? `<div class="post-media">${renderMedia(post.media)}</div>` : ''}
                <div class="reactions">
                    ${Object.entries(REACTION_EMOJIS).map(([type, emoji]) => `
                        <button class="reaction-btn ${reactions[currentUser.pub] === type ? 'active' : ''}" 
                                onclick="react('${post.id}', '${type}')">
                            ${emoji} ${getReactionCount(reactions, type)}
                        </button>
                    `).join('')}
                </div>
                <div class="comment-section">
                    <div class="comment-input">
                        <input type="text" id="comment-${post.id}" placeholder="Adicionar comentário..." 
                               onkeypress="if(event.key==='Enter') comment('${post.id}')">
                        <button onclick="comment('${post.id}')">➤</button>
                    </div>
                    <div id="comments-${post.id}">
                        ${Object.entries(comments).map(([cid, c]) => `
                            <div class="comment">
                                <strong onclick="loadUserProfile('${c.author}')" style="cursor:pointer; color:var(--accent);">
                                    ${c.authorAlias || 'Anônimo'}
                                </strong>: ${c.text}
                                <br><small>${formatTime(c.timestamp)}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            postsDiv.appendChild(postEl);
        }

        function getReactionCount(reactions, type) {
            const count = Object.values(reactions).filter(r => r === type).length;
            return count > 0 ? count : '';
        }

        function renderMedia(media) {
            if (media.startsWith('data:image')) return `<img src="${media}" alt="Desenho">`;
            if (media.startsWith('data:audio')) return `<audio controls src="${media}"></audio>`;
            return '';
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function showCreatePost() {
            document.getElementById('createPostModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('createPostModal').classList.remove('show');
            document.getElementById('postText').value = '';
            document.getElementById('audioPlayback').classList.add('hidden');
            clearCanvas();
        }

        function changePostType() {
            const type = document.getElementById('postType').value;
            document.getElementById('textPost').classList.toggle('hidden', type !== 'text');
            document.getElementById('audioPost').classList.toggle('hidden', type !== 'audio');
            document.getElementById('drawingPost').classList.toggle('hidden', type !== 'drawing');
        }

        async function createPost() {
            const type = document.getElementById('postType').value;
            let content = '';
            let media = '';
            
            if (type === 'text') {
                content = document.getElementById('postText').value.trim();
                if (!content) return alert('Escreva algo!');
            } else if (type === 'audio' && audioBlob) {
                media = await blobToDataURL(audioBlob);
            } else if (type === 'drawing') {
                media = canvas.toDataURL();
            }

            const postId = Date.now().toString();
            const timestamp = Date.now();
            
            // CORREÇÃO 5: Estrutura de dados simplificada e mais robusta
            const postData = {
                author: currentUser.pub,
                authorAlias: currentUser.alias,
                content,
                media,
                timestamp,
                bumpedAt: timestamp,
                ttl: timestamp + (24 * 60 * 60 * 1000)
            };

            // Salva no feed global e no perfil do usuário
            gun.get('beemote').get('posts').get(postId).put(postData);
            user.get('posts').get(postId).put(postData);

            // Atualiza estatísticas
            user.get('stats').get('posts').once(count => {
                user.get('stats').get('posts').put((count || 0) + 1);
            });

            closeModal();
            // Recarrega feed após um pequeno delay para sincronização
            setTimeout(() => loadFeed(), 500);
        }

        // PERFIL
        async function loadProfile() {
            const profile = await getUserProfile(currentUser.pub);
            document.getElementById('profileName').textContent = currentUser.alias;
            
            const bioEl = document.getElementById('bioText');
            bioEl.textContent = profile.bio || 'Sem bio (clique para editar)';
            
            const joinedDate = profile.joined ? new Date(profile.joined) : new Date();
            document.getElementById('profileJoined').textContent = `Membro desde: ${joinedDate.toLocaleDateString('pt-BR')}`;

            const stats = profile.stats || {};
            document.getElementById('statPosts').textContent = stats.posts || 0;
            document.getElementById('statLikes').textContent = stats.likesReceived || 0;
            document.getElementById('statComments').textContent = stats.commentsReceived || 0;

            loadTestimonials();
        }

        function getUserProfile(pub) {
            return new Promise(resolve => {
                const profile = { stats: {}, joined: Date.now(), bio: '' };
                gun.user(pub).get('profile').once(data => {
                    if (data) Object.assign(profile, data);
                    resolve(profile);
                });
            });
        }

        function editBio() {
            const bioEl = document.getElementById('bioText');
            const currentBio = bioEl.textContent.replace('Sem bio (clique para editar)', '');
            const newBio = prompt('Edite sua bio:', currentBio);
            if (newBio !== null) {
                user.get('profile').get('bio').put(newBio);
                bioEl.textContent = newBio || 'Sem bio (clique para editar)';
            }
        }

        // ... (resto das funções permanecem semelhantes) ...

        // CONTATOS
        function loadContacts() {
            const contactsDiv = document.getElementById('contactsList');
            contactsDiv.innerHTML = '';
            
            user.get('contacts').map().on((data, id) => {
                if (!data || !data.pub) return;
                const contactEl = document.createElement('div');
                contactEl.className = 'contact-item';
                contactEl.innerHTML = `
                    <div>
                        <strong>${data.alias || id}</strong>
                        <small style="color:var(--text-secondary);">${data.status}</small>
                    </div>
                    ${data.status === 'pending' ? 
                        `<button onclick="acceptContact('${data.pub}')">Aceitar</button>` : 
                        `<button class="danger" onclick="removeContact('${data.pub}')">Remover</button>`
                    }
                `;
                contactsDiv.appendChild(contactEl);
            });
        }

        async function requestContact() {
            const username = document.getElementById('contactUsername').value.trim();
            if (!username) return;
            
            gun.get('~@' + username).once(data => {
                if (!data) return alert('Usuário não encontrado');
                
                const pub = data.pub;
                // Verifica se já não é contato
                user.get('contacts').get(pub).once(contact => {
                    if (contact && contact.status === 'accepted') {
                        alert('Já é seu contato!');
                        return;
                    }
                    
                    user.get('contacts').get(pub).put({
                        pub,
                        alias: username,
                        status: 'pending',
                        timestamp: Date.now()
                    });
                    
                    gun.user(pub).get('contact_requests').get(currentUser.pub).put({
                        from: currentUser.pub,
                        alias: currentUser.alias,
                        timestamp: Date.now()
                    });
                    
                    document.getElementById('contactUsername').value = '';
                });
            });
        }

        function acceptContact(pub) {
            user.get('contacts').get(pub).put({ status: 'accepted' });
            loadContacts();
        }

        function removeContact(pub) {
            user.get('contacts').get(pub).put(null);
            loadContacts();
        }

        // COMUNIDADES
        function showCreateCommunity() {
            document.getElementById('communityModal').classList.add('show');
        }

        function closeCommunityModal() {
            document.getElementById('communityModal').classList.remove('show');
            document.getElementById('communityName').value = '';
            document.getElementById('communityDesc').value = '';
        }

        function createCommunity() {
            const name = document.getElementById('communityName').value.trim();
            const desc = document.getElementById('communityDesc').value.trim();
            
            if (!name) return;
            
            const communityId = Date.now().toString();
            gun.get('beemote').get('communities').get(communityId).put({
                id: communityId,
                name,
                desc,
                owner: currentUser.pub,
                members: { [currentUser.pub]: 'admin' },
                created: Date.now()
            });
            
            closeCommunityModal();
            setTimeout(() => loadCommunities(), 500);
        }

        function loadCommunities() {
            const communitiesDiv = document.getElementById('communitiesList');
            communitiesDiv.innerHTML = '';
            
            gun.get('beemote').get('communities').map().on((data, id) => {
                if (!data || !data.id) return;
                const isMember = data.members && data.members[currentUser.pub];
                const communityEl = document.createElement('div');
                communityEl.className = 'community-item';
                communityEl.innerHTML = `
                    <h3>${data.name}</h3>
                    <p>${data.desc || 'Sem descrição'}</p>
                    <div class="community-actions">
                        ${!isMember ? 
                            `<button onclick="joinCommunity('${data.id}')">Participar</button>` :
                            `<button class="secondary" onclick="leaveCommunity('${data.id}')">Sair</button>`
                        }
                        ${data.owner === currentUser.pub ? 
                            `<button class="danger" onclick="deleteCommunity('${data.id}')">Excluir</button>` : ''
                        }
                    </div>
                `;
                communitiesDiv.appendChild(communityEl);
            });
        }

        function joinCommunity(id) {
            gun.get('beemote').get('communities').get(id).get('members').get(currentUser.pub).put('member');
            setTimeout(() => loadCommunities(), 500);
        }

        function leaveCommunity(id) {
            gun.get('beemote').get('communities').get(id).get('members').get(currentUser.pub).put(null);
            setTimeout(() => loadCommunities(), 500);
        }

        function deleteCommunity(id) {
            gun.get('beemote').get('communities').get(id).put(null);
            setTimeout(() => loadCommunities(), 500);
        }

        // EXPORTAR/IMPORTAR
        async function exportData() {
            const data = { profile: {}, posts: {}, contacts: {}, testimonials: {} };
            
            await user.get('profile').once(p => data.profile = p || {});
            await user.get('posts').map().once((p, id) => data.posts[id] = p);
            await user.get('contacts').map().once((c, id) => data.contacts[id] = c);
            await user.get('testimonials').map().once((t, id) => data.testimonials[id] = t);
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `beemote_backup_${currentUser.alias}_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.profile) user.get('profile').put(data.profile);
                    Object.entries(data.posts || {}).forEach(([id, post]) => user.get('posts').get(id).put(post));
                    Object.entries(data.contacts || {}).forEach(([id, contact]) => user.get('contacts').get(id).put(contact));
                    Object.entries(data.testimonials || {}).forEach(([id, testimonial]) => user.get('testimonials').get(id).put(testimonial));
                    
                    alert('Dados importados com sucesso!');
                    location.reload();
                } catch (err) {
                    alert('Erro ao importar dados: arquivo inválido');
                }
            };
            reader.readAsText(file);
        }

        // CORREÇÃO 6: Recebe o evento como parâmetro
        function switchTab(event, tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.remove('hidden');
            
            // Recarrega ao mudar de aba
            if (tab === 'feed') loadFeed();
            if (tab === 'profile') loadProfile();
            if (tab === 'contacts') loadContacts();
            if (tab === 'communities') loadCommunities();
        }

        async function getUserAlias(pub) {
            return new Promise(resolve => {
                if (!pub) return resolve('Anônimo');
                gun.user(pub).get('alias').once(alias => {
                    resolve(alias || pub.substring(0, 8) + '...');
                });
            });
        }

        // Reações e comentários
        function react(postId, type) {
            if (!currentUser) return;
            
            gun.get('beemote').get('posts').get(postId).get('reactions').get(currentUser.pub).put(type);
            // Recarrega feed para atualizar contagem
            setTimeout(() => loadFeed(), 200);
        }

        function comment(postId) {
            const input = document.getElementById(`comment-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            
            const commentId = Date.now().toString();
            gun.get('beemote').get('posts').get(postId).get('comments').get(commentId).put({
                author: currentUser.pub,
                authorAlias: currentUser.alias,
                text,
                timestamp: Date.now()
            });
            
            input.value = '';
            setTimeout(() => loadFeed(), 300);
        }

        // CORREÇÃO 7: Listener apenas uma vez
        let contactListenerSet = false;
        if (!contactListenerSet) {
            user.get('contact_requests').map().on((data, id) => {
                if (data && data.from && data.from !== currentUser?.pub) {
                    console.log('Nova solicitação de contato de:', data.alias);
                    loadContacts();
                }
            });
            contactListenerSet = true;
        }

        // Helpers
        function blobToDataURL(blob) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);
                reader.readAsDataURL(blob);
            });
        }

        function toggleRecording() {
            // Implementação básica de gravação
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audio = document.getElementById('audioPlayback');
                        audio.src = URL.createObjectURL(audioBlob);
                        audio.classList.remove('hidden');
                    };
                    mediaRecorder.start();
                    document.getElementById('recordBtn').classList.add('hidden');
                    document.getElementById('stopBtn').classList.remove('hidden');
                    document.getElementById('audioStatus').textContent = 'Gravando...';
                });
        }

        function stopRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('recordBtn').classList.remove('hidden');
            document.getElementById('stopBtn').classList.add('hidden');
            document.getElementById('audioStatus').textContent = 'Gravação concluída';
        }

        // CORREÇÃO 8: Auto-refresh mais inteligente
        setInterval(() => {
            if (currentTab === 'feed' && currentUser) {
                // Só recarrega se houver mudanças
                loadFeed();
            }
        }, 15000);
    </script>
